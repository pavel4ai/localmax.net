name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "schemas/**"
      - "benchmarks/**"
      - "containers/released-images.json"
      - "scripts/build-worker-assets.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare
    runs-on: ubuntu-latest
    environment: production
    # Skip cleanly rather than failing every push until the Cloudflare token is configured.
    # A red X on main for a known-missing credential trains people to ignore red Xs.
    if: vars.CLOUDFLARE_CONFIGURED == 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate worker assets
        run: node scripts/build-worker-assets.mjs

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply localmax --remote --config apps/api/wrangler.toml

      # The API deploys first: the website binds to it as a service, and deploying the site
      # against a missing binding would take the whole front end down.
      - name: Deploy the API
        run: npx wrangler deploy --config apps/api/wrangler.toml

      - name: Build the website
        run: npm run build --workspace apps/web

      - name: Deploy the website
        run: npx wrangler deploy --config apps/web/dist/server/wrangler.json

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS https://api.localmax.net/health -o /tmp/health.json \
               && grep -q '"ok":true' /tmp/health.json; then
              echo "API healthy"; break
            fi
            echo "waiting for the API to come up ($i/10)"; sleep 6
          done
          curl -fsS https://api.localmax.net/v1/profiles > /dev/null

          # Written to a file rather than piped into grep: `grep -q` exits on the first
          # match and closes the pipe, curl then fails to write and exits 23, and pipefail
          # turns a passing smoke test into a failed deploy.
          curl -fsS https://localmax.net/ -o /tmp/home.html
          grep -q "LocalMax" /tmp/home.html
          echo "Deployment verified"
