name: Containers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
      arm64_runtimes:
        description: "Also build llm/diffusion for arm64 (unvalidated on GB10)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  OWNER: pavel4ai

jobs:
  # Each architecture builds on its own native runner and pushes a digest-only image;
  # a final job merges them into one manifest list. QEMU emulation was the alternative and
  # is not viable here: emulating a torch or vLLM build takes hours and frequently exhausts
  # the runner, which is precisely why arm64 support tends to get dropped.
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: echo "value=$(echo '${{ github.event.inputs.version || github.ref_name }}' | tr -d v)" >> "$GITHUB_OUTPUT"

  # The runtime images are FROM the base, so the base must be pushed before they start.
  # Running them in one matrix let them race it, and every runtime build failed on a tag
  # that did not exist yet.
  base:
    name: base (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/base.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/localmax-base:${{ needs.version.outputs.value }}-${{ matrix.arch }}
          build-args: LOCALMAX_VERSION=${{ needs.version.outputs.value }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: [version, base]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The runtime images pull vLLM and torch, whose aarch64 CUDA support is the open
        # item in the bake-off, so arm64 for those is opt-in rather than default:
        # publishing a manifest that resolves on a DGX Spark to an image that cannot serve
        # would be worse than not publishing one.
        include:
          - { image: llm, arch: amd64, runner: ubuntu-latest, dockerfile: containers/llm.Dockerfile }
          - { image: diffusion, arch: amd64, runner: ubuntu-latest, dockerfile: containers/diffusion.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # torch and vLLM together are tens of gigabytes; a default runner does not have room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/localmax-${{ matrix.image }}:${{ needs.version.outputs.value }}-${{ matrix.arch }}
          build-args: |
            LOCALMAX_VERSION=${{ needs.version.outputs.value }}
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/localmax-base:${{ needs.version.outputs.value }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  merge:
    name: Manifest — ${{ matrix.image }}
    needs: [version, base, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [base, llm, vision, diffusion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      # Vision and LLM share one image; the vision tag is an alias, not a rebuild.
      - name: Merge per-architecture images into one manifest list
        env:
          V: ${{ needs.version.outputs.value }}
          SRC: ${{ matrix.image == 'vision' && 'llm' || matrix.image }}
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${OWNER}/localmax-${{ matrix.image }}"
          SRC_REF="${REGISTRY}/${OWNER}/localmax-${SRC}"

          # Include only the architectures that actually built. A manifest listing an
          # arm64 entry that does not exist resolves to a pull failure on the one platform
          # least able to diagnose it.
          SOURCES=""
          for arch in amd64 arm64; do
            if docker buildx imagetools inspect "${SRC_REF}:${V}-${arch}" >/dev/null 2>&1; then
              SOURCES="${SOURCES} ${SRC_REF}:${V}-${arch}"
              echo "including ${arch}"
            else
              echo "::notice::${SRC} has no ${arch} build; omitting it from the manifest"
            fi
          done
          [ -n "$SOURCES" ] || { echo "::error::no architectures built for ${SRC}"; exit 1; }

          for tag in "$V" latest; do
            docker buildx imagetools create -t "${REF}:${tag}" $SOURCES
          done

      - id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "${REGISTRY}/${OWNER}/localmax-${{ matrix.image }}:${{ needs.version.outputs.value }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST"

      # Keyless signing. A result reaches Verified only if its recorded digest is one the
      # project actually published, so this signature is what that check rests on.
      #
      # Retried because Rekor intermittently returns 404 reading back an entry it has just
      # written. The signature is real; only the immediate verification read races. Failing
      # the release on that would block every Verified result on a transparency-log hiccup.
      - name: Sign
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${OWNER}/localmax-${{ matrix.image }}@${{ steps.digest.outputs.value }}"
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes "$REF"; then
              echo "signed on attempt $attempt"
              exit 0
            fi
            echo "::warning::cosign attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          echo "::error::cosign failed after 5 attempts"
          exit 1

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/localmax-${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Record the released digest
        run: |
          node scripts/record-release.mjs \
            --image "${REGISTRY}/${OWNER}/localmax-${{ matrix.image }}" \
            --tag "${{ needs.version.outputs.value }}" \
            --digest "${{ steps.digest.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: released-${{ matrix.image }}
          path: containers/released-images.json

  publish-digests:
    name: Publish released digests
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests

      # Until this list is non-empty every submission stays Community and unranked, so the
      # commit is what actually turns verification on.
      - name: Merge and commit
        run: |
          set -euo pipefail
          node scripts/merge-releases.mjs /tmp/digests
          git config user.name "localmax-release"
          git config user.email "release@localmax.net"
          git add containers/released-images.json
          git diff --staged --quiet || git commit -m "release: record signed image digests"
          git push
